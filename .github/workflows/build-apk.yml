name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: flutter_app
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Rename APK with timestamp
        working-directory: flutter_app
        run: |
          MODE="${{ github.event.inputs.build_mode }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_SRC="build/app/outputs/flutter-apk/app-${MODE}.apk"
          APK_DEST="build/app/outputs/flutter-apk/AttendanceOS_${MODE}_${TIMESTAMP}_${SHORT_SHA}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=AttendanceOS_${MODE}_${TIMESTAMP}_${SHORT_SHA}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: flutter_app/${{ env.APK_PATH }}
          retention-days: 30

      - name: Create Release (release mode only)
        if: github.event.inputs.build_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AttendanceOS Build #${{ github.run_number }}
          files: flutter_app/${{ env.APK_PATH }}
          draft: false
          prerelease: true
